<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d12">
<title>NPM Hub — запуск</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:#0d0d12; color:#e8e8f0;
         font:15px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif; padding:20px 16px 40px; }
  .wrap { max-width:480px; margin:0 auto; }
  .logo { font-size:26px; font-weight:800; text-align:center;
          background:linear-gradient(135deg,#58a6ff,#bc8cff);
          -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .sub { font-size:13px; color:#8a8a9e; text-align:center; margin:2px 0 18px; }
  label { display:block; font-size:13px; color:#8a8a9e; margin-bottom:12px; }
  input { display:block; width:100%; margin-top:6px; padding:13px 14px; font:inherit;
          color:#e8e8f0; background:#16161f; border:1px solid #262633; border-radius:10px; }
  button { display:block; width:100%; font:inherit; font-weight:700; border:0; border-radius:10px;
           padding:14px; margin:8px 0; cursor:pointer; background:#58a6ff; color:#0d0d12; min-height:50px; }
  button.ghost { background:transparent; color:#58a6ff; border:1px solid #262633; }
  button:disabled { opacity:.5; }
  .log { margin-top:14px; padding:12px 14px; background:#16161f; border:1px solid #262633;
         border-radius:10px; font-size:13px; min-height:60px; }
  .log:empty::before { content:"Здесь будет ход запуска…"; color:#55555f; }
  .err { color:#ff7b72; }
  .ok { color:#3fb950; }
  .note { font-size:12px; color:#55555f; margin-top:12px; text-align:center; }
  .lock { text-align:center; margin:4px 0 14px; }
  .lock .age { font-size:12px; color:#8a8a9e; margin-bottom:10px; }
  .link { display:block; text-align:center; font-size:13px; color:#58a6ff;
          margin:6px 0 0; text-decoration:none; }
  .spacer { height:8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">◆ NPM Hub</div>
  <div class="sub">Запуск хаба на GitHub Actions</div>
  <div id="lockscreen" class="lock" style="display:none">
    <div class="age" id="lockage"></div>
    <button class="ghost" id="lock-open">Подключиться</button>
    <button id="lock-vault">Внешняя память</button>
    <a class="link" href="#" id="lock-settings">Настройки</a>
  </div>
  <label>GitHub-токен (repo + workflow)
    <input id="token" type="password" placeholder="ghp_…" autocomplete="off"
           autocorrect="off" autocapitalize="none" spellcheck="false">
  </label>
  <label>Раннер (пусто = GitHub, иначе метка своего ПК)
    <input id="runner" type="text" placeholder="" autocomplete="off"
           autocorrect="off" autocapitalize="none" spellcheck="false">
  </label>
  <button id="launch">Запустить хаб</button>
  <button id="restart" class="ghost">Остановить и перезапустить ранер</button>
  <button id="reopen" class="ghost" style="display:none">Открыть последний</button>
  <button id="vault" class="ghost">Внешняя память</button>
  <div id="log" class="log"></div>
  <div class="note">Токен хранится только на этом устройстве.</div>
</div>
<script>
const REPO = 'sj0404-collab/zen-panel';
const GH = 'https://api.github.com';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
function log(m, cls) {
  const el = $('log');
  el.insertAdjacentHTML('beforeend', `<div class="${cls || ''}">${esc(m)}</div>`);
  el.scrollTop = el.scrollHeight;
}
function genZt() {
  try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID().replace(/-/g, ''); } catch (e) {}
  const h = '0123456789abcdef';
  let s = '';
  for (let i = 0; i < 32; i++) s += h[Math.floor(Math.random() * 16)];
  return s;
}
async function api(path, token, opts) {
  const o = opts || {};
  const r = await fetch(GH + path, {
    method: o.method || 'GET',
    headers: { Accept: 'application/vnd.github+json', Authorization: 'token ' + token },
    body: o.body
  });
  if (r.status === 401) throw new Error('401: токен недействителен. Вставьте новый.');
  if (r.status === 403) throw new Error('403: нет прав (нужны repo + workflow) или лимит.');
  if (r.status === 429) throw new Error('429: слишком много запросов — подождите минуту.');
  if (r.status === 404) return null;
  if (r.status === 202 || r.status === 204) return true;
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function dispatchHub(token, zt, runner, replace) {
  const inputs = { os: 'linux', label: 'hub-apk', token: zt, gh_token: token, replace: replace === true };
  if (runner) inputs.runner_linux = runner;
  await api(`/repos/${REPO}/actions/workflows/hub.yml/dispatches`, token, {
    method: 'POST',
    body: JSON.stringify({ ref: 'main', inputs })
  });
}
const ACTIVE_RUN_STATUSES = ['queued', 'requested', 'waiting', 'in_progress', 'pending'];
const SESSION_WORKFLOWS = new Set([
  '.github/workflows/hub.yml',
  '.github/workflows/agent.yml',
  '.github/workflows/opencode.yml',
  '.github/workflows/desks.yml'
]);
function isActiveRun(run) {
  return !!run && ACTIVE_RUN_STATUSES.includes(run.status);
}
function isHubRun(run) {
  return !!run && (run.path === '.github/workflows/hub.yml' || run.name === 'NPM Hub');
}
function isSessionRun(run) {
  return !!run && (SESSION_WORKFLOWS.has(run.path) ||
    ['NPM Hub', 'Zen agent', 'OpenCode', 'opencode', 'Remote session', 'Desks'].includes(run.name));
}
async function listActiveRuns(token, predicate) {
  const active = [];
  for (let page = 1; page <= 5; page++) {
    const r = await api(`/repos/${REPO}/actions/runs?per_page=100&page=${page}`, token);
    const runs = r && r.workflow_runs;
    if (!runs || !runs.length) break;
    for (const run of runs) {
      if (isActiveRun(run) && (!predicate || predicate(run))) active.push(run);
    }
    if (runs.length < 100) break;
  }
  return active;
}
async function cancelCurrentRun(token) {
  const runs = await listActiveRuns(token, isHubRun);
  const ids = [];
  let failed = 0;
  for (const run of runs) {
    try {
      await api(`/repos/${REPO}/actions/runs/${run.id}/cancel`, token, { method: 'POST' });
      ids.push(run.id);
    } catch (e) {
      if (!/HTTP 409/.test(e && e.message || '')) failed++;
    }
  }
  if (failed) throw new Error('GitHub не принял остановку старого запуска.');
  return ids;
}
async function waitForRunsToStop(token, ids, sleepMs, attempts) {
  const pending = new Set((ids || []).map(String));
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const pause = sleepMs == null ? 3000 : sleepMs;
  const limit = attempts == null ? 400 : attempts;
  for (let i = 0; pending.size && i < limit; i++) {
    await sleep(pause);
    for (const id of Array.from(pending)) {
      const run = await api(`/repos/${REPO}/actions/runs/${id}`, token);
      if (!run || !isActiveRun(run)) pending.delete(id);
    }
  }
  if (pending.size) throw new Error('Старый запуск ещё не остановлен GitHub. Повторите перезапуск через минуту.');
  return true;
}
async function cancelAndWait(token) {
  const ids = await cancelCurrentRun(token);
  if (ids.length) await waitForRunsToStop(token, ids);
  return ids.length;
}
async function assertNoActiveSession(token) {
  const active = await listActiveRuns(token, isSessionRun);
  if (!active.length) return;
  if (active.some(isHubRun)) {
    throw new Error('NPM Hub уже запущен. Откройте его или используйте «Остановить и перезапустить».');
  }
  throw new Error('Другая сессия уже использует раннер. Остановите её перед запуском NPM Hub.');
}
async function restartRunner(token, zt, runner) {
  const active = await listActiveRuns(token, isSessionRun);
  if (active.some(run => !isHubRun(run))) {
    throw new Error('Другая сессия уже использует раннер. Остановите её перед перезапуском NPM Hub.');
  }
  const n = await cancelAndWait(token);
  if (n > 0) log('Остановлено активных ранов: ' + n, 'ok');
  else log('Активных ранов hub.yml не найдено.', 'err');
  log('Запускаю новый ранер…');
  await dispatchHub(token, zt, runner, true);
}
function parseSessionFile(f) {
  const raw = decodeURIComponent(escape(atob((f.content || '').replace(/\n/g, ''))));
  return JSON.parse(raw);
}
async function readHubSession(token) {
  // The branch is organised in folders now; the old flat name stays as a
  // fallback so an unmigrated branch keeps connecting.
  for (const path of ['live/session-hub-linux.json', 'session-hub-linux.json']) {
    const f = await api(`/repos/${REPO}/contents/${path}?ref=session-state&t=${Date.now()}`, token);
    if (f) return parseSessionFile(f);
  }
  return null;
}
async function waitForHub(token, sinceMs, sleepMs) {
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  for (let i = 0; i < 240; i++) {
    const s = await readHubSession(token);
    const born = s && s.startedAt ? new Date(s.startedAt).getTime() : 0;
    if (s && s.state === 'live' && born >= sinceMs - 15000 && (s.hubUrl || s.url)) return s;
    await sleep(sleepMs || 5000);
  }
  throw new Error('Таймаут: хаб не сообщил адрес за 20 минут.');
}
async function preflightHub(base, zt, expectedRunId) {
  const r = await fetch(base + '/api/tools?zt=' + encodeURIComponent(zt));
  const j = await r.json().catch(() => null);
  if (!j || j.success !== true) throw new Error('Хаб не принял токен (' +
    ((j && j.error) || ('HTTP ' + r.status)) + '). Перезапустите хаб.');
  if (expectedRunId && j.runId && String(j.runId) !== String(expectedRunId)) {
    throw new Error('Адрес отвечает другим запуском раннера #' + j.runId + '.');
  }
  return true;
}
function buildOpenUrl(s, zt) {
  const base = String(s.hubUrl || s.url || '').replace(/\/+$/, '');
  return base + '/m?zt=' + encodeURIComponent(zt);
}
function saveLast(url) {
  try { localStorage.setItem('hub_last', JSON.stringify({ url, at: Date.now() })); } catch (e) {}
}
function readLast() {
  try { return JSON.parse(localStorage.getItem('hub_last') || 'null'); } catch (e) { return null; }
}
// ── UI ──
try { $('token').value = localStorage.getItem('hub_gh_token') || ''; } catch (e) {}
try { $('runner').value = localStorage.getItem('hub_runner') || ''; } catch (e) {}
let last = readLast();
const nowMs = Date.now();
function lastOriginToken() {
  const u = last && last.url;
  if (!u) return { base: '', zt: '' };
  try {
    const p = new URL(u);
    return { base: p.origin, zt: p.searchParams.get('zt') || '' };
  } catch (e) { return { base: '', zt: '' }; }
}
function vaultUrl() {
  const { base, zt } = lastOriginToken();
  if (!base) return '';
  return base.replace(/\/+$/, '') + '/external-memory.html' + (zt ? '?zt=' + encodeURIComponent(zt) : '');
}
async function openLast() {
  if (!last || !last.url) return;
  const { base, zt } = lastOriginToken();
  if (!base) { log('Сохранённый адрес не найден.', 'err'); return; }
  try {
    await preflightHub(base, zt);
    location.href = last.url;
  } catch (e) {
    log('Последний хаб недоступен: ' + (e && e.message || e), 'err');
  }
}
function openVault() {
  const u = vaultUrl();
  if (!u) { log('Сначала подключись к хабу — адрес появится после запуска.', 'err'); return; }
  location.href = u;
}
let lockTimer = null;
(function autoLock() {
  if (!last || !last.url) return;
  const age = Math.max(0, nowMs - (last.at || 0));
  const ageMin = Math.round(age / 60000);
  const lock = $('lockscreen');
  if (age <= 30 * 60 * 1000) {
    lock.style.display = '';
    const total = 3;
    let left = total;
    const ageEl = $('lockage');
    ageEl.textContent = 'Хаб (' + ageMin + ' мин назад) живой. Открываю через ' + left + '…';
    lockTimer = setInterval(() => {
      const next = --left;
      if (next <= 0) { clearInterval(lockTimer); openLast(); return; }
      ageEl.textContent = 'Хаб (' + ageMin + ' мин назад) живой. Открываю через ' + next + '…';
    }, 1000);
  } else {
    const b = $('reopen');
    if (b) {
      b.style.display = '';
      b.textContent = 'Открыть последний (' + ageMin + ' мин назад)';
      b.onclick = openLast;
    }
  }
})();
$('lock-open').onclick = () => { clearInterval(lockTimer); openLast(); };
$('lock-settings').onclick = (e) => { e.preventDefault(); clearInterval(lockTimer); $('lockscreen').style.display = 'none'; };
$('lock-vault').onclick = () => openVault();
$('vault').onclick = () => openVault();
$('launch').onclick = async () => {
  const token = ($('token').value || '').trim();
  if (!token) { log('Вставьте GitHub-токен.', 'err'); return; }
  try { localStorage.setItem('hub_gh_token', token); } catch (e) {}
  const runner = ($('runner').value || '').trim();
  try { localStorage.setItem('hub_runner', runner); } catch (e) {}
  const btn = $('launch');
  btn.disabled = true;
  try {
    await assertNoActiveSession(token);
    const zt = genZt();
    const since = Date.now();
    log('Отправляю запуск…');
    await dispatchHub(token, zt, runner);
    log('Ран принят. Жду адрес (обычно 1–3 мин)…', 'ok');
    const s = await waitForHub(token, since);
    const base = String(s.hubUrl || s.url || '').replace(/\/+$/, '');
    log('Проверяю доступ…');
    await preflightHub(base, zt, s.runId);
    const url = buildOpenUrl(s, zt);
    saveLast(url);
    log('Хаб жив. Открываю…', 'ok');
    location.href = url;
  } catch (e) {
    log('Не вышло: ' + (e && e.message || e), 'err');
  } finally {
    btn.disabled = false;
  }
};
$('restart').onclick = async () => {
  const token = ($('token').value || '').trim();
  if (!token) { log('Вставьте GitHub-токен.', 'err'); return; }
  try { localStorage.setItem('hub_gh_token', token); } catch (e) {}
  const runner = ($('runner').value || '').trim();
  try { localStorage.setItem('hub_runner', runner); } catch (e) {}
  const btn = $('restart');
  btn.disabled = true;
  try {
    const zt = genZt();
    await restartRunner(token, zt, runner);
    log('Ран принят. Жду адрес (обычно 1–3 мин)…', 'ok');
    const s = await waitForHub(token, Date.now());
    const base = String(s.hubUrl || s.url || '').replace(/\/+$/, '');
    log('Проверяю доступ…');
    await preflightHub(base, zt, s.runId);
    const url = buildOpenUrl(s, zt);
    saveLast(url);
    log('Хаб жив. Открываю…', 'ok');
    location.href = url;
  } catch (e) {
    log('Не вышло: ' + (e && e.message || e), 'err');
  } finally {
    btn.disabled = false;
  }
};
</script>
</body>
</html>
