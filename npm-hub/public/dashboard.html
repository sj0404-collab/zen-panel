<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e14">
  <title>Dashboard — NPM Hub</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="hub.css">
</head>
<body data-page="d">
  <div class="topbar" id="topbar"></div>

  <div class="main">
    <div class="sidebar">
      <div class="sb">
        <div class="sb-lbl">Инструменты</div>
        <div id="tool-list"></div>
        <div class="sb-lbl" style="margin-top:12px">Сессии</div>
        <div id="term-list"></div>
      </div>
      <div class="sb-actions">
        <button class="btn" onclick="openStandaloneTerminal()" style="flex:1;text-align:center">>_ Терминал</button>
        <button class="btn btn-p" onclick="showNewTermModal()" style="flex:1;text-align:center">+ Сессия</button>
      </div>
    </div>
    <div class="content">
      <div class="page on">
        <div class="ph"><h1>Dashboard</h1><p>AI инструменты — выберите папку и нажмите Применить</p></div>
        <div class="stats" id="stats"></div>
        <div class="grid" id="grid"></div>
        <div id="runner-card"></div>
      </div>
    </div>
  </div>

  <!-- New Session Modal -->
  <div class="modal-bg" id="modal-newterm">
    <div class="modal">
      <h2>Новая сессия</h2>
      <div class="newterm-grid" id="newterm-grid"></div>
      <div style="margin-bottom:10px">
        <label style="font-size:10px;color:var(--t2)">Рабочая папка:</label>
        <div style="display:flex;gap:6px;margin-top:4px">
          <input type="text" id="newterm-cwd" placeholder="путь..." style="flex:1;padding:7px 10px;background:var(--bg0);border:1px solid var(--bdr);border-radius:6px;color:var(--t1);font-size:12px;font-family:monospace;outline:none">
          <button class="btn" onclick="openBrowser()">📁</button>
        </div>
        <div id="recent-paths" style="margin-top:6px;max-height:80px;overflow-y:auto"></div>
      </div>
      <div class="modal-actions"><button class="btn" onclick="closeModal('modal-newterm')">Отмена</button></div>
    </div>
  </div>

  <!-- Browser Modal -->
  <div class="modal-bg" id="modal-browser">
    <div class="modal">
      <h2>Выберите папку</h2>
      <div class="modal-bar">
        <input type="text" id="browser-path" onkeydown="if(event.key==='Enter')browseTo(this.value)">
        <button class="btn btn-p" onclick="browseTo(document.getElementById('browser-path').value)">Открыть</button>
      </div>
      <div class="modal-drives" id="browser-drives"></div>
      <div class="modal-list" id="browser-list"></div>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal('modal-browser')">Отмена</button>
        <button class="btn btn-ok" onclick="selectBrowserPath()">Выбрать</button>
      </div>
    </div>
  </div>

  <script src="offline.js"></script>
  <script src="bridge.js"></script>
  <script src="dashboard-app.js"></script>
</body>
</html>
