<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e14">
  <title>Панель — NPM Hub</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0e14;color:#e6edf3;min-height:100dvh;padding-bottom:76px}
    .wrap{max-width:640px;margin:0 auto;padding:14px 14px 20px}
    .head{display:flex;align-items:center;gap:8px;padding:6px 2px 12px}
    .logo{font-size:19px;font-weight:800;background:linear-gradient(135deg,#58a6ff,#bc8cff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:12px 14px;margin-bottom:10px}
    .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    .note{font-size:12px;color:#8b949e}
    .mono{font-family:ui-monospace,monospace;font-size:12px;word-break:break-all}
    button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 14px;cursor:pointer;background:#238636;color:#fff;min-height:44px}
    button.ghost{background:transparent;color:#58a6ff;border:1px solid #30363d}
    button.small{padding:7px 10px;min-height:36px;font-size:13px}
    button.warn{background:#7a2e2e}
    button:disabled{opacity:.5}
    input{font:inherit;color:#e6edf3;background:#0d1117;border:1px solid #30363d;border-radius:10px;padding:11px 12px;width:100%}
    .tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#161b22;border-top:1px solid #30363d;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:50}
    .tabs button{flex:1;background:transparent;color:#8b949e;font-size:11px;min-height:52px;border-radius:8px;padding:4px 2px}
    .tabs button b{display:block;font-size:17px;font-weight:400}
    .tabs button.on{color:#58a6ff}
    .sec{display:none}
    .sec.on{display:block}
    .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:#30363d;color:#e6edf3}
    .badge.ok{background:rgba(63,185,80,.2);color:#3fb950}
    .badge.bad{background:rgba(248,81,73,.2);color:#f85149}
    .badge.run{background:rgba(88,166,255,.2);color:#58a6ff}
    .kv{display:flex;gap:8px;align-items:center;margin:4px 0}
    .kv .k{color:#8b949e;font-size:12px;min-width:70px}
    .spin{color:#8b949e;font-size:13px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="head"><div class="logo">◆ Панель</div><div class="note" id="srv-note"></div></div>

  <div class="sec" id="p-acc"></div>
  <div class="sec" id="p-repo"></div>
  <div class="sec" id="p-act"></div>
  <div class="sec" id="p-sess"></div>

  <div class="tabs">
    <button id="t-acc" onclick="switchTab('acc')"><b>◉</b>Аккаунт</button>
    <button id="t-repo" onclick="switchTab('repo')"><b>▤</b>Репо</button>
    <button id="t-act" onclick="switchTab('act')"><b>▶</b>Actions</button>
    <button id="t-sess" onclick="switchTab('sess')"><b>⬢</b>Сессии</button>
  </div>
</div>
<script src="panel-app.js"></script>
</body>
</html>
