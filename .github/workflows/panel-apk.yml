name: Build Zen Panel APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", "build.gradle.kts", "settings.gradle.kts", ".github/workflows/panel-apk.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Gradle 8.7
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"
      - name: Build release APK
        run: |
          /opt/gradle-8.7/bin/gradle wrapper --gradle-version 8.7 --no-daemon
          ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Verify bundled panel
        run: |
          APK=$(find app -path '*release*.apk' | head -1)
          test -n "$APK"
          unzip -l "$APK" | grep -q 'assets/panel/index.html'
          unzip -l "$APK" | grep -q 'assets/panel/desks.html'
      - uses: actions/upload-artifact@v4
        with: { name: zen-panel-apk, path: app/build/outputs/apk/release/*.apk }
