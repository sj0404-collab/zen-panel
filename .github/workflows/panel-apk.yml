name: Build Zen Panel APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/panel-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Version from git
        run: |
          CODE=$(git rev-list --count HEAD)
          SHA=$(git rev-parse --short HEAD)
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "VERSION_SHA=$SHA" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.$CODE.$SHA" >> "$GITHUB_ENV"
          echo "TAG=v1.$CODE" >> "$GITHUB_ENV"
          echo "version 1.$CODE.$SHA (code $CODE)"

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4

      - name: Install Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Optional release keystore from secrets
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/keystore/upload.jks
          echo "using ANDROID_KEYSTORE_BASE64"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ( /opt/gradle-8.9/bin/gradle wrapper --gradle-version 8.9 --no-daemon &&
            ./gradlew assembleRelease --no-daemon --stacktrace ) 2>&1 | tee /tmp/gradle-build.log
          # Record how it was signed so a debug-signed APK is obvious.
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if command -v apksigner >/dev/null; then apksigner verify --print-certs "$APK" || true
          else echo "apksigner not on PATH (ok)"; fi

      - name: Publish failed Gradle log for diagnosis
        if: failure()
        run: |
          mkdir -p ci
          cp /tmp/gradle-build.log ci/last-build-failure.log
          git config user.name "Zen Panel CI"
          git config user.email "ci@zen-panel"
          git add ci/last-build-failure.log
          git commit -m "ci: capture failed APK build log" || exit 0
          git push

      - name: Package APK
        run: |
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$SRC"
          unzip -l "$SRC" | grep -q 'assets/panel/index.html'
          unzip -l "$SRC" | grep -q 'assets/panel/desks.html'
          NAME="zen-panel-${VERSION_NAME}.apk"
          cp "$SRC" "$NAME"
          echo "APK_FILE=$NAME" >> "$GITHUB_ENV"
          ls -lh "$NAME"

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: zen-panel-build-log, path: /tmp/gradle-build.log, if-no-files-found: warn }

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: zen-panel-apk
          path: zen-panel-*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Zen Panel ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: ${{ env.APK_FILE }}
          body: |
            Автосборка APK.

            | | |
            |---|---|
            | Версия | `${{ env.VERSION_NAME }}` |
            | versionCode | `${{ env.VERSION_CODE }}` |
            | Коммит | `${{ github.sha }}` |

            Установка поверх предыдущей сборки работает: `versionCode` растёт с каждым коммитом.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
