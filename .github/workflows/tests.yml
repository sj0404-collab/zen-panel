name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["agent/**", "desktop/**", "npm-hub/**", "hub/**", "tools/**", "app/src/main/assets/panel/**", "tests/**", ".github/workflows/**"]
  pull_request:
    paths: ["agent/**", "desktop/**", "npm-hub/**", "hub/**", "tools/**", "app/src/main/assets/panel/**", "tests/**", ".github/workflows/**"]

jobs:
  jsdom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install test dependencies
        working-directory: tests
        run: npm ci
      - name: Run the jsdom suites
        working-directory: tests
        run: npm test

  shell:
    # Its own job on purpose. The jsdom suites above run first in npm test, and
    # when one of them fails the && chain stops - the shell suites never run and
    # the failure looks like the whole suite is about that one test. Measured:
    # a red hub-connect-e2e.js hid restore-chats-test.sh entirely.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run the shell suites
        # The localrun suite runs here too, and deliberately NOT only as part of
        # tests/package.json: the jsdom chain stops at the first red suite, so
        # while mobile-touch is red on q4/q101 the tunnel keeper test would
        # never be reached by the job that claims to run it.
        run: |
          bash tests/restore-chats-test.sh
          bash tests/localrun-keeper-test.sh

